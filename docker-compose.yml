services:
  postgres:
    image: postgres:16-alpine
    container_name: nlp-to-sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nlp_to_sql}
    ports:
      # Host port 5433 by default so this stack can coexist with any other
      # local Postgres already holding 5432.
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Compose reports the service healthy only once Postgres accepts
      # connections, so `up --wait` is enough to gate the app start.
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nlp_to_sql}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
